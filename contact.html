  <link rel="stylesheet" href="css/style.css" />

</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="assets/profile.jpg" alt="Athulya Surendran Krishnaleela" class="profile-pic" />
      <h2>Athulya Surendran Krishnaleela</h2>
    </div>
    <ul class="sidebar-links">
      <li><a href="index.html">About</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="experience.html">Experience</a></li>

      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="accolades.html">Accolades</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <header>
      <span class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></span>
      <h1>Get in Touch</h1>
    </header>

    <section class="contact-section">
      <p>If you’d like to connect, collaborate, or discuss an opportunity, feel free to drop me a message below or reach out directly on social media.</p>

      <form class="contact-form" action="#" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div class="social-links">
        <h3>Connect with me</h3>
        <div class="icons">
          <a href="https://www.linkedin.com/in/athulyask/" target="_blank"><i class="fab fa-linkedin"></i></a>
          <a href="mailto:athulyask@gmail.com"><i class="fas fa-envelope"></i></a>
          <a href="https://github.com/athulyask" target="_blank"><i class="fab fa-github"></i></a>
        </div>
      </div>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
